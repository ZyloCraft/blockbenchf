name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- 1) Patch Blockbench source (save dialog + native look) ----------
      - name: Patch source
        run: |
          cat > /tmp/helper.ts << 'EOF'
          import { registerPlugin } from '@capacitor/core'
          import JSZip from 'jszip'

          interface SaveFilePluginInterface {
              saveFile(options: { fileName: string; data: string; mimeType: string }): Promise<{ uri: string }>;
              setBackEnabled(options: { enabled: boolean }): Promise<void>;
          }
          const SaveFilePlugin = registerPlugin<SaveFilePluginInterface>('SaveFilePlugin');

          const MIME_BY_EXTENSION: Record<string, string> = {
              png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
              zip: 'application/zip', json: 'application/json', txt: 'text/plain',
          };

          async function capacitorSaveFile(content: any, file_name: string): Promise<boolean> {
              try {
                  // "assets.zip" is Blockbench's multi-file export. If it only holds one real file, save that file alone.
                  if (file_name === 'assets.zip' && content instanceof Blob) {
                      try {
                          let zip = await JSZip.loadAsync(content);
                          let names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
                          let has_images = names.some(n => /\.(png|jpe?g|tga)$/i.test(n));
                          let real = names.filter(n => has_images || !/\.mtl$/i.test(n));
                          if (real.length === 1) {
                              content = await zip.files[real[0]].async('blob');
                              file_name = real[0].split('/').pop();
                          }
                      } catch (e) {
                          console.warn('Could not inspect zip', e);
                      }
                  }
                  let data: string;
                  if (content instanceof Blob) {
                      data = await new Promise<string>((resolve, reject) => {
                          let reader = new FileReader();
                          reader.onload = () => resolve((reader.result as string).split(',')[1]);
                          reader.onerror = reject;
                          reader.readAsDataURL(content);
                      });
                  } else if (typeof content === 'string' && content.startsWith('data:')) {
                      data = content.split(',')[1];
                  } else {
                      data = btoa(unescape(encodeURIComponent(content)));
                  }
                  let extension = (file_name.split('.').pop() || '').toLowerCase();
                  let mimeType = MIME_BY_EXTENSION[extension] || 'application/octet-stream';

                  await SaveFilePlugin.saveFile({ fileName: file_name, data, mimeType });
                  return true;
              } catch (e) {
                  if (e && String((e as any).message || e).toLowerCase().includes('cancel')) return true;
                  console.error('Capacitor save failed', e);
                  return false;
              }
          }
          function blockbenchSaveAs(content: any, file_name: string, options: any = {}) {
              // @ts-ignore
              if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
                  capacitorSaveFile(content, file_name).then(ok => {
                      if (!ok) saveAs(content, file_name, options);
                  });
              } else {
                  saveAs(content, file_name, options);
              }
          }

          // ---- Android back gesture (predictive back): shrink + blur while swiping, then close ----
          function setupNativeBack() {
              const w = window as any;
              if (!(w.Capacitor && w.Capacitor.isNativePlatform && w.Capacitor.isNativePlatform())) return;

              let nativeEnabled = false;
              let closing = false;
              let current: { el: HTMLElement | null, close: () => void } | null = null;

              function findTop(): { el: HTMLElement | null, close: () => void } | null {
                  try {
                      const oi = w.open_interface;
                      if (oi && typeof oi === 'object') {
                          if (typeof oi.cancel === 'function') return { el: oi.object || null, close: () => oi.cancel() };
                          if (typeof oi.hide === 'function') return { el: oi.object || null, close: () => oi.hide() };
                      } else if (typeof oi === 'string' && oi && w.open_dialog) {
                          const id = w.open_dialog;
                          return { el: document.getElementById(id), close: () => w.$('dialog#' + id).find('.cancel_btn:not([disabled])').trigger('click') };
                      }
                      const newTab = w.Interface && w.Interface.tab_bar && w.Interface.tab_bar.new_tab;
                      if (newTab && newTab.visible) return { el: null, close: () => newTab.close() };
                      if (w.open_menu) return { el: null, close: () => w.open_menu.hide() };
                      if (w.ReferenceImageMode && w.ReferenceImageMode.active) return { el: null, close: () => w.ReferenceImageMode.deactivate() };
                  } catch (e) { /* ignore */ }
                  return null;
              }
              function blackout(): HTMLElement | null {
                  return document.getElementById('blackout');
              }
              function resetStyles(el: HTMLElement | null) {
                  if (el) {
                      el.style.transform = '';
                      el.style.opacity = '';
                      el.style.transition = '';
                  }
                  const b = blackout();
                  if (b) {
                      b.style.opacity = '';
                      b.style.backgroundColor = '';
                      b.style.backdropFilter = '';
                      (b.style as any).webkitBackdropFilter = '';
                      b.style.transition = '';
                  }
              }
              function apply(progress: number, edge: number) {
                  const p = Math.max(0, Math.min(1, progress));
                  if (current && current.el) {
                      const dx = (edge === 1 ? -1 : 1) * p * 24;
                      current.el.style.transition = 'none';
                      current.el.style.transform = 'translateX(' + dx + 'px) scale(' + (1 - 0.1 * p) + ')';
                      current.el.style.opacity = String(1 - 0.35 * p);
                  }
                  const b = blackout();
                  if (b && b.style.display !== 'none') {
                      const blur = 'blur(' + (8 * (1 - p)) + 'px)';
                      b.style.transition = 'none';
                      b.style.opacity = '1';
                      b.style.backgroundColor = 'rgba(16,19,22,' + (0.55 * (1 - p)) + ')';
                      b.style.backdropFilter = blur;
                      (b.style as any).webkitBackdropFilter = blur;
                  }
              }

              w.__bbBack = {
                  start(edge: number) {
                      closing = false;
                      current = findTop();
                      apply(0, edge);
                  },
                  progress(p: number, edge: number) {
                      if (current) apply(p, edge);
                  },
                  cancel() {
                      const el = current && current.el;
                      if (el) {
                          el.style.transition = 'transform .18s ease, opacity .18s ease';
                          el.style.transform = '';
                          el.style.opacity = '';
                      }
                      setTimeout(() => resetStyles(el), 200);
                      current = null;
                  },
                  commit() {
                      const top = current || findTop();
                      current = null;
                      if (!top) return false;
                      if (closing) return true;
                      closing = true;
                      const el = top.el;
                      if (el) {
                          el.style.transition = 'transform .16s ease-in, opacity .16s ease-in';
                          el.style.transform = 'scale(0.88)';
                          el.style.opacity = '0';
                      }
                      setTimeout(() => {
                          try { top.close(); } catch (e) { console.error(e); }
                          resetStyles(el);
                          closing = false;
                      }, el ? 150 : 0);
                      return true;
                  }
              };

              // Tell the native side when there is something to close, so the system can play its own
              // back-to-home animation the rest of the time.
              setInterval(() => {
                  const should = !!findTop();
                  if (should !== nativeEnabled) {
                      nativeEnabled = should;
                      SaveFilePlugin.setBackEnabled({ enabled: should }).catch(() => {});
                  }
              }, 100);
          }
          setupNativeBack();
          EOF
          cat > /tmp/patch.py << 'EOF'
          import re

          # --- file_system.ts: native save dialog + back gesture ---
          p = 'js/file_system.ts'
          s = open(p, encoding='utf-8').read()
          if 'blockbenchSaveAs' in s:
              print('file_system.ts already patched, skipping')
          else:
              helper = open('/tmp/helper.ts', encoding='utf-8').read()
              marker = "import saveAs from 'file-saver'"
              assert marker in s, 'PATCH FAILED: import line not found'
              for old, new in [
                  ("saveAs(options.content, file_name, {})", "blockbenchSaveAs(options.content, file_name, {})"),
                  ("saveAs(blob, file_name, {autoBOM: true})", "blockbenchSaveAs(blob, file_name, {autoBOM: true})"),
                  ("saveAs(blob, file_name)", "blockbenchSaveAs(blob, file_name)"),
              ]:
                  assert old in s, 'PATCH FAILED: not found -> ' + old
                  s = s.replace(old, new)
              s = s.replace(marker, marker + '\n' + helper, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('file_system.ts patched OK')

          # --- web.js: the web "back = undo" history trick must not run inside the app ---
          p = 'js/web.js'
          s = open(p, encoding='utf-8').read()
          if 'bb_native' in s:
              print('web.js already patched, skipping')
          else:
              guard = "(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())"
              pat_load = re.compile(r"addEventListener\('load', function\(\) \{(\s*)window\.history\.pushState\(\{\}, ''\)")
              assert pat_load.search(s), 'PATCH FAILED: web.js load handler not found'
              s = pat_load.sub(lambda m: "addEventListener('load', function() {" + m.group(1) + "/* bb_native */ if (" + guard + ") return;" + m.group(1) + "window.history.pushState({}, '')", s, count=1)
              pat_pop = re.compile(r"addEventListener\('popstate', e => \{")
              assert pat_pop.search(s), 'PATCH FAILED: web.js popstate handler not found'
              s = pat_pop.sub(lambda m: "addEventListener('popstate', e => {\n\tif " + guard + " return;", s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
              print('web.js patched OK')
          EOF
          python3 /tmp/patch.py
          cat >> css/general.css << 'EOF'

          /* ---- native app feel ---- */
          * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
          html, body { overscroll-behavior: none; }
          *:focus { outline: none; }
          *:not(input):not(textarea):not([contenteditable]) { -webkit-user-select: none; user-select: none; }
          input, textarea, [contenteditable], .selectable, .selectable * { -webkit-user-select: text; user-select: text; }
          dialog.dialog { animation: bbDialogIn .2s cubic-bezier(.2,.8,.2,1); }
          @keyframes bbDialogIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
          EOF
          sed -i 's#initial-scale=1"#initial-scale=1, maximum-scale=1, user-scalable=no"#' index.html

      # ---------- 2) Build the web app ----------
      - run: npm install
      - run: npm install @capacitor/core@7
      - run: npm run build-web

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest favicon.png icon.png icon_full.png icon_maskable.png www/
          cp -r css assets font lib lang content dist www/
          rm -f www/dist/*.map

      # ---------- 3) Create the Android project ----------
      - run: npm install @capacitor/android@7 @capacitor/cli@7

      - name: Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.zyr7.blockbench",
            "appName": "Blockbench",
            "webDir": "www",
            "backgroundColor": "#181b1f",
            "android": { "backgroundColor": "#181b1f" }
          }
          EOF

      - run: npx cap add android
      - run: npx cap sync android

      - name: Bump version (so updates install over old ones)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Android settings (Android 6.0+, predictive back)
        run: |
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 23/" android/variables.gradle
          grep -n "minSdkVersion\|compileSdkVersion\|targetSdkVersion" android/variables.gradle
          sed -i '0,/<application/s//<application android:enableOnBackInvokedCallback="true"/' android/app/src/main/AndroidManifest.xml
          grep -c 'enableOnBackInvokedCallback="true"' android/app/src/main/AndroidManifest.xml

      # ---------- 4) Native "Save As" plugin ----------
      - name: Add custom Save File native plugin
        run: |
          PKG_DIR="android/app/src/main/java/com/zyr7/blockbench"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/SaveFilePlugin.java" << 'EOF'
          package com.zyr7.blockbench;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.net.Uri;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "SaveFilePlugin")
          public class SaveFilePlugin extends Plugin {

              @PluginMethod
              public void saveFile(PluginCall call) {
                  String fileName = call.getString("fileName", "file.txt");
                  String data = call.getString("data");
                  String mimeType = call.getString("mimeType", "application/octet-stream");

                  if (data == null) {
                      call.reject("No data provided");
                      return;
                  }

                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mimeType);
                  intent.putExtra(Intent.EXTRA_TITLE, fileName);
                  startActivityForResult(call, intent, "handleSaveResult");
              }

              @PluginMethod
              public void setBackEnabled(PluginCall call) {
                  final boolean enabled = call.getBoolean("enabled", false);
                  getActivity().runOnUiThread(() -> MainActivity.setWebBackEnabled(enabled));
                  call.resolve();
              }

              @ActivityCallback
              private void handleSaveResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      call.reject("Save cancelled");
                      return;
                  }
                  Uri uri = result.getData().getData();
                  try {
                      String data = call.getString("data");
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      ContentResolver resolver = getContext().getContentResolver();
                      OutputStream out = resolver.openOutputStream(uri);
                      out.write(bytes);
                      out.flush();
                      out.close();
                      JSObject ret = new JSObject();
                      ret.put("uri", uri.toString());
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Failed to write file: " + e.getMessage());
                  }
              }
          }
          EOF
          cat > "$PKG_DIR/MainActivity.java" << 'EOF'
          package com.zyr7.blockbench;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;
          import androidx.activity.BackEventCompat;
          import androidx.activity.OnBackPressedCallback;
          import androidx.annotation.NonNull;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static OnBackPressedCallback webBackCallback;

              static void setWebBackEnabled(boolean enabled) {
                  if (webBackCallback != null) {
                      webBackCallback.setEnabled(enabled);
                  }
              }

              private void runJs(String js) {
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.evaluateJavascript(js, null);
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setBackgroundColor(0xFF181B1F);

                  webBackCallback = new OnBackPressedCallback(false) {
                      @Override
                      public void handleOnBackStarted(@NonNull BackEventCompat backEvent) {
                          runJs("window.__bbBack&&window.__bbBack.start(" + backEvent.getSwipeEdge() + ")");
                      }

                      @Override
                      public void handleOnBackProgressed(@NonNull BackEventCompat backEvent) {
                          runJs("window.__bbBack&&window.__bbBack.progress(" + backEvent.getProgress() + "," + backEvent.getSwipeEdge() + ")");
                      }

                      @Override
                      public void handleOnBackCancelled() {
                          runJs("window.__bbBack&&window.__bbBack.cancel()");
                      }

                      @Override
                      public void handleOnBackPressed() {
                          getBridge().getWebView().evaluateJavascript(
                              "(window.__bbBack?window.__bbBack.commit():false)",
                              value -> {
                                  if (!"true".equals(value)) {
                                      setEnabled(false);
                                      MainActivity.this.onBackPressed();
                                  }
                              }
                          );
                      }
                  };
                  getOnBackPressedDispatcher().addCallback(this, webBackCallback);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (webBackCallback != null && webBackCallback.isEnabled()) {
                      super.onBackPressed();
                      return;
                  }
                  if (Build.VERSION.SDK_INT < 31) {
                      moveTaskToBack(true);
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  webBackCallback = null;
                  super.onDestroy();
              }
          }
          EOF

      # ---------- 5) Native look: icon, splash, bar colors (cosmetic, never breaks the build) ----------
      - name: Native look (icon, splash, bar colors)
        continue-on-error: true
        run: |
          pip install pillow
          cat > /tmp/look.py << 'EOF'
          from PIL import Image
          import glob, os, re

          RES = 'android/app/src/main/res'
          BG = (24, 27, 31, 255)
          icon = Image.open('icon.png').convert('RGBA')

          def put_center(canvas, img, ratio):
              size = int(min(canvas.size) * ratio)
              small = img.resize((size, size), Image.LANCZOS)
              canvas.paste(small, ((canvas.width - size) // 2, (canvas.height - size) // 2), small)

          # launcher icons
          for name, scale in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              d = f'{RES}/mipmap-{name}'
              if not os.path.isdir(d):
                  continue
              legacy = Image.new('RGBA', (int(48 * scale),) * 2, BG)
              put_center(legacy, icon, 0.92)
              legacy.save(f'{d}/ic_launcher.png')
              legacy.save(f'{d}/ic_launcher_round.png')
              layer = Image.new('RGBA', (int(108 * scale),) * 2, (0, 0, 0, 0))
              put_center(layer, icon, 0.62)
              layer.save(f'{d}/ic_launcher_foreground.png')

          os.makedirs(f'{RES}/values', exist_ok=True)
          open(f'{RES}/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#181b1f</color>\n</resources>\n')

          # splash images
          for p in glob.glob(f'{RES}/drawable*/splash.png'):
              w, h = Image.open(p).size
              canvas = Image.new('RGBA', (w, h), BG)
              put_center(canvas, icon, 0.28)
              canvas.save(p)

          # status bar / navigation bar / splash background colors
          p = f'{RES}/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          bars = '        <item name="android:statusBarColor">#181b1f</item>\n        <item name="android:navigationBarColor">#101316</item>\n'
          def fix(m):
              block = m.group(0)
              extra = bars
              if 'Theme.SplashScreen' in m.group(1) and 'windowSplashScreenBackground' not in block:
                  extra += '        <item name="windowSplashScreenBackground">#181b1f</item>\n'
              return block.replace('</style>', extra + '    </style>')
          s = re.sub(r'<style name="[^"]+" parent="([^"]*)">.*?</style>', fix, s, flags=re.S)
          open(p, 'w', encoding='utf-8').write(s)
          print('Native look applied')
          EOF
          python3 /tmp/look.py

      # ---------- 6) Fixes + build ----------
      - name: Fix Kotlin stdlib duplicate classes
        run: |
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/build.gradle
          echo "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Restore signing key (same key every build, so updates install over old versions)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KEYSTORE_B64" ]; then
            KEYSTORE_B64=""
          fi
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: blockbench-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
