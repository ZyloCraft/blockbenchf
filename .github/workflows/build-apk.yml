name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build-web

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest favicon.png icon.png icon_full.png icon_maskable.png www/
          cp -r css assets font lib lang content dist www/

      - run: npm install @capacitor/core @capacitor/android @capacitor/cli
      - run: npx cap init "Blockbench" "com.zyr7.blockbench" --web-dir=www
      - run: npx cap add android
      - run: npx cap sync android

      - name: Fix Kotlin stdlib duplicate classes
        run: |
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy {" >> android/build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'" >> android/build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'" >> android/build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'" >> android/build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: blockbench-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
